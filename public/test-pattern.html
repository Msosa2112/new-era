<!DOCTYPE html>
<html>
<head>
  <style>
    body {
      margin: 0;
      background: #1a060b;
      display: flex;
      flex-direction: column;
      align-items: center;
      color: white;
      font-family: sans-serif;
    }
    .box {
      width: 90vw;
      height: 80vh;
      border: 2px solid red;
      margin: 20px;
      position: relative;
      overflow: hidden;
    }
    img, svg {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }
  </style>
</head>
<body>
  <h2>1. Untouched pattern extended.svg with img tag (object-fit: cover)</h2>
  <div class="box">
    <img src="/assets/pattern-extended-original.svg" />
  </div>

  <h2>2. Untouched pattern.svg with img tag (object-fit: cover)</h2>
  <div class="box">
    <img src="/assets/pattern-original.svg" />
  </div>
</body>
</html>
